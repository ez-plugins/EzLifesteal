# ==============================================================
# EzLifesteal - Revive beacon settings
# ==============================================================

revive-beacon:
  # Enables reviving a banned target by right-clicking a beacon with a voucher heart item.
  enabled: true
  # Heart item id (PDC heart-id) that is accepted as the revive voucher.
  voucher-heart-id: revive
  require-sneak: false
  max-distance: 8.0
  consume-on-fail: false
  require-voucher-in-beacon: true
  voucher-hold-seconds: 300.0
  whitelist-enabled: false
  # Whitelisted beacon locations are persisted to revive-beacon-whitelist.yml
  # to avoid accidental override while editing this config.
  # Deterministic selection strategy. Supported: NEAREST_BANNED, COMMAND_SELECTION
  # NEAREST_BANNED picks the closest banned target in radius, then UUID lexical order for ties.
  # COMMAND_SELECTION requires the reviver to first run /revive <player>.
  target-strategy: COMMAND_SELECTION
  broadcast:
    enabled: false
    hold-start-message-key: beacon-revive-broadcast-hold-start
    complete-message-key: beacon-revive-broadcast-complete
  animation:
    enabled: true
    duration-ticks: 30
    spiral-steps: 10
    ring-count: 3
    vertical-lift-per-step: 0.08
    particles:
      spiral:
        type: END_ROD
        count: 2
        offset-x: 0.0
        offset-y: 0.0
        offset-z: 0.0
        speed: 0.0
      ring:
        type: ENCHANT
        count: 2
        offset-x: 0.03
        offset-y: 0.03
        offset-z: 0.03
        speed: 0.01
      impact:
        type: TOTEM_OF_UNDYING
        count: 20
        offset-x: 0.4
        offset-y: 0.6
        offset-z: 0.4
        speed: 0.01
    sounds:
      loop:
        type: BLOCK_BEACON_AMBIENT
        volume: 0.3
        pitch: 1.2
      impact:
        type: BLOCK_BEACON_ACTIVATE
        volume: 1.0
        pitch: 1.15

  # ============================================================
  # Beacon spawn feature — plugin places beacon blocks in the world.
  # Use '/lifesteal beacon spawn' to trigger manually, or enable
  # the schedule to auto-spawn at a recurring interval.
  # Requires revive-beacon.enabled: true
  # ============================================================
  spawn:
    enabled: true
    # Maximum number of simultaneously active spawned beacons.
    max-concurrent: 1

    # WorldGuard protection region created around each beacon.
    # Requires WorldGuard to be installed; silently skipped if absent.
    worldguard:
      enabled: true
      radius: 10
      deny-build: true
      deny-pvp: false
      deny-mob-damage: false
      deny-explosions: false

    # EzCountdown timer shown while the beacon is warming up.
    # If EzCountdown is absent, an internal Bukkit timer is used as fallback.
    countdown:
      enabled: true
      duration-seconds: 300
      # Supported: ACTION_BAR, BOSS_BAR, CHAT, TITLE, SCOREBOARD
      display-types:
        - ACTION_BAR
        - BOSS_BAR
      # Message shown in the countdown display. Supports color codes (&) and placeholders:
      # {formatted}  – human-readable remaining time (e.g. "4m 58s")
      # {minutes}, {seconds}, {hours}, {days}  – individual time units
      # {name}  – countdown name
      format-message: "&5\u2620 &d&lRevive Beacon &5\u2620 &r&7 {formatted} until active"
      # Boss bar color. Valid values: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      boss-bar-color: PURPLE
      # Boss bar style. Valid values: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
      boss-bar-style: SEGMENTED_20
      # Prefix used for the EzCountdown countdown name (countdown ID = <name-prefix><beacon-short-id>).
      name-prefix: "ezls-beacon-"
      # Per-display-type message overrides. Keys match display-types values (e.g. ACTION_BAR, BOSS_BAR).
      # Leave empty ({}) to use format-message for all types.
      per-type-messages: {}

    # Random world-spawn bounds used by the schedule and '/lifesteal beacon spawn'
    # without explicit coordinates.
    random-spawn:
      enabled: true
      world: world
      min-x: -1000
      max-x: 1000
      # Y bounds for spawn height. Set both to 0 to use the world surface (getHighestBlockY).
      min-y: 0
      max-y: 0
      min-z: -1000
      max-z: 1000

    # Cooldown between beacon spawns (applies to both manual and scheduled spawns).
    # Set to 0 to disable the cooldown.
    cooldown-minutes: 0

    # Multi-region spawn configuration (optional). When configured, the beacon is
    # spawned inside one of the regions using weighted random selection.
    # If empty, random-spawn above is used as fallback.
    # random-spawn-regions:
    #   region1:
    #     enabled: true
    #     world: world
    #     min-x: -500
    #     max-x: 500
    #     min-y: 60
    #     max-y: 120
    #     min-z: -500
    #     max-z: 500
    #     weight: 2
    #   region2:
    #     enabled: true
    #     world: world_nether
    #     min-x: -200
    #     max-x: 200
    #     min-y: 40
    #     max-y: 100
    #     min-z: -200
    #     max-z: 200
    #     weight: 1

    # Recurring schedule that auto-spawns a new random beacon.
    schedule:
      enabled: true
      interval-minutes: 5

    # How long a beacon stays AVAILABLE before it is automatically removed.
    # Set to 0 to keep indefinitely.
    expiry-minutes: 30

    # The "cool event" broadcast when a beacon becomes available.
    availability-event:
      broadcast:
        enabled: true
        message-key: beacon-spawn-available-broadcast
      title:
        enabled: true
        title-key: beacon-spawn-available-title
        subtitle-key: beacon-spawn-available-subtitle
      particles:
        enabled: true
      fireworks:
        enabled: true
