name: EzLifesteal
version: ${project.version}
main: com.skyblockexp.ezlifesteal.EzLifestealPlugin
author: Shadow48402
description: Lifesteal plugin with YAML/MySQL storage and smurf detection
# This descriptor keeps EzLifesteal compatible with Bukkit/Spigot servers that
# do not read the modern paper-plugin.yml file.
api-version: 1.21
folia-supported: true
softdepend:
  - PlaceholderAPI
  - Vault
  - EzSeasons
commands:
  lifesteal:
    description: Main command for EzLifesteal
    usage: /lifesteal <help|about|hearts|set|add|remove|reset|revive|resetall|transfer|withdraw|top|shop|smurf|reload|test|hologram>
    permission: lifesteal.command.base
  hearts:
    description: Open the heart voucher shop
    usage: /hearts
    permission: lifesteal.command.base
  revive:
    description: Select a revive target for beacon revives
    usage: /revive <player>
    permission: lifesteal.command.base
permissions:
  # ── Leaf permissions ────────────────────────────────────────────────────────
  lifesteal.command.base:
    description: Use /lifesteal to check your hearts and open sub-commands
    default: true
  lifesteal.top:
    description: View the hearts leaderboard with /lifesteal top
    default: true
  lifesteal.transfer:
    description: Transfer hearts to another player
    default: true
  lifesteal.withdraw:
    description: Withdraw hearts as a voucher item
    default: true
  lifesteal.manage.view:
    description: View stored hearts for other players
    default: false
  lifesteal.manage.modify:
    description: Add, remove, set, reset, or revive player hearts
    default: false
  lifesteal.manage.resetall:
    description: Reset every stored profile to the default hearts
    default: false
  lifesteal.admin.banlist:
    description: View the list of banned (zero-heart) players
    default: false
  lifesteal.reload:
    description: Reload EzLifesteal configuration and services
    default: false
  lifesteal.alert:
    description: Receive smurf farming alerts
    default: false
  lifesteal.smurf.manage:
    description: Access the smurf management GUI
    default: false
  lifesteal.scoreboard.place:
    description: Place the hologram scoreboard
    default: false
  lifesteal.scoreboard.remove:
    description: Remove the hologram scoreboard
    default: false
  lifesteal.test:
    description: Allows simulating lifesteal kills and deaths
    default: false
  # ── Composite permissions ───────────────────────────────────────────────────
  lifesteal.manage.*:
    description: Modify stored hearts for other players
    default: op
    children:
      lifesteal.manage.view: true
      lifesteal.manage.modify: true
      lifesteal.manage.resetall: true
  lifesteal.scoreboard.*:
    description: Manage EzLifesteal hologram or scoreboard displays
    default: op
    children:
      lifesteal.scoreboard.place: true
      lifesteal.scoreboard.remove: true
  lifesteal.hologram:
    description: Legacy alias for hologram placement permissions
    default: op
    children:
      lifesteal.scoreboard.place: true
      lifesteal.scoreboard.remove: true
  # ── Role bundles ────────────────────────────────────────────────────────────
  lifesteal.player:
    description: Access basic EzLifesteal features
    default: true
    children:
      lifesteal.command.base: true
      lifesteal.top: true
      lifesteal.transfer: true
      lifesteal.withdraw: true
  lifesteal.mod:
    description: Moderate EzLifesteal gameplay
    default: op
    children:
      lifesteal.player: true
      lifesteal.alert: true
      lifesteal.manage.view: true
      lifesteal.smurf.manage: true
      lifesteal.scoreboard.*: true
  lifesteal.admin:
    description: Allows managing lifesteal data
    default: op
    children:
      lifesteal.mod: true
      lifesteal.manage.*: true
      lifesteal.admin.banlist: true
      lifesteal.reload: true
      lifesteal.test: true
  lifesteal.*:
    description: Grants all EzLifesteal permissions
    default: op
    children:
      lifesteal.admin: true
      lifesteal.mod: true
      lifesteal.player: true
