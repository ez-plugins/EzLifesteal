# Optional craftable recipes. Define recipes under the `recipes` section using the heart id as the key.
# Supported types: "shaped" and "shapeless".
# Shaped recipe example:
# recipes:
#   gold:
#     type: shaped
#     amount: 1
#     pattern:
#       - "ABA"
#       - "BCB"
#       - "ABA"
#     ingredients:
#       A: GOLD_INGOT
#       B: NETHER_STAR
#       C: DIAMOND
# Shapeless recipe example:
#   basic:
#     type: shapeless
#     amount: 1
#     ingredients:
#       - IRON_INGOT
#       - NETHER_STAR
