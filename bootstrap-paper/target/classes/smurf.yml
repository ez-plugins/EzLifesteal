# ==============================================================
# EzLifesteal - Smurf detection settings
# ==============================================================

enabled: true

# Trigger alert when the same victim is killed this many times
# inside the configured time window.
same-victim-threshold: 3

# Rolling window used for detection.
time-window-minutes: 15

# Permission required to receive alerts.
notify-permission: lifesteal.alert

# GUI / history caps.
history-limit: 50      # Alert entries shown in alert history GUI.
kill-history-limit: 120 # Raw kill log entries retained for review.

# Trusted players ignored by smurf checks.
exempted-players: []
