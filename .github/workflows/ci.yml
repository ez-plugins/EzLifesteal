name: Plugin CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    name: Build plugin (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '21'
            paper-version: '1.21.11-R0.1-SNAPSHOT'
            worldguard-version: '7.0.13'
            worldedit-version: '7.3.12'
            mockbukkit-artifact-id: 'mockbukkit-v1.21'
            mockbukkit-version: '4.110.0'
            run-tests: false
          - java-version: '25'
            paper-version: '26.2.build.60-beta'
            worldguard-version: '7.0.16'
            worldedit-version: '7.4.3'
            mockbukkit-artifact-id: 'mockbukkit-v26.2'
            mockbukkit-version: 'local'
            run-tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and install MockBukkit minecraft/v26.2
        if: matrix.run-tests
        run: |
          git clone --depth=1 --branch minecraft/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Build plugin (Java 21 compatibility lane)
        if: ${{ !matrix.run-tests }}
        run: mvn -B -ntp clean package -pl bootstrap-paper -am -Dmaven.test.skip=true -Dpaper.version=${{ matrix.paper-version }} -Dworldguard.version=${{ matrix.worldguard-version }} -Dworldedit.version=${{ matrix.worldedit-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifact-id }} -Dmockbukkit.version=${{ matrix.mockbukkit-version }}

      - name: Verify plugin build
        if: matrix.run-tests
        run: mvn -B -ntp clean verify -pl bootstrap-paper -am -Dpaper.version=${{ matrix.paper-version }} -Dworldguard.version=${{ matrix.worldguard-version }} -Dworldedit.version=${{ matrix.worldedit-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifact-id }} -Dmockbukkit.version=${{ matrix.mockbukkit-version }}

      - name: Upload coverage to Codecov
        if: matrix.run-tests
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bootstrap-paper/target/jacoco.exec
          flags: unittests
          fail_ci_if_error: false

  publish-github-packages:
    name: Publish to GitHub Packages
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and install MockBukkit minecraft/v26.2
        run: |
          git clone --depth=1 --branch minecraft/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Publish Maven artifacts
        run: mvn -B -ntp -DskipTests deploy -pl bootstrap-paper -am
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
