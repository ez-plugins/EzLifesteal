name: Plugin CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit dev/26.1.1
        run: |
          git init /tmp/MockBukkit
          git -C /tmp/MockBukkit remote add origin https://github.com/MockBukkit/MockBukkit.git
          git -C /tmp/MockBukkit fetch --depth=1 origin d245e0a
          git -C /tmp/MockBukkit checkout FETCH_HEAD
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Verify plugin build
        run: mvn -B -ntp clean verify
