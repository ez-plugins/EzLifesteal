name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-tests:
    name: Unit tests (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '21'
            paper-version: '1.21.11-R0.1-SNAPSHOT'
            worldguard-version: '7.0.13'
            worldedit-version: '7.3.12'
            mockbukkit-artifact-id: 'mockbukkit-v1.21'
            mockbukkit-version: '4.110.0'
          - java-version: '25'
            paper-version: '26.2.build.60-beta'
            worldguard-version: '7.0.16'
            worldedit-version: '7.4.3'
            mockbukkit-artifact-id: 'mockbukkit-v26.2'
            mockbukkit-version: 'local'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and install MockBukkit upgrade/v26.2
        if: matrix.mockbukkit-version == 'local'
        run: |
          git clone --depth=1 --branch upgrade/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run unit tests
        run: mvn -B -ntp test -pl bootstrap-paper -am -Dtest='*Test,!*FeatureTest' -Dsurefire.failIfNoSpecifiedTests=false -Dpaper.version=${{ matrix.paper-version }} -Dworldguard.version=${{ matrix.worldguard-version }} -Dworldedit.version=${{ matrix.worldedit-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifact-id }} -Dmockbukkit.version=${{ matrix.mockbukkit-version }}

  unit-test-coverage:
    name: Unit test coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit upgrade/v26.2
        run: |
          git clone --depth=1 --branch upgrade/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Generate unit test coverage report
        run: mvn -B -ntp clean verify -pl bootstrap-paper -am -Djacoco.haltOnFailure=false -Dpaper.version=26.2.build.60-beta -Dworldguard.version=7.0.16 -Dworldedit.version=7.4.3 -Dmockbukkit.artifactId=mockbukkit-v26.2 -Dmockbukkit.version=local

      - name: Add coverage summary to workflow report
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          csv_path = Path("bootstrap-paper/target/site/jacoco/jacoco.csv")
          if not csv_path.exists():
              raise SystemExit("jacoco.csv was not produced")

          with csv_path.open("r", encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)

          instruction_missed  = sum(int(row["INSTRUCTION_MISSED"])  for row in rows)
          instruction_covered = sum(int(row["INSTRUCTION_COVERED"]) for row in rows)
          branch_missed       = sum(int(row["BRANCH_MISSED"])       for row in rows)
          branch_covered      = sum(int(row["BRANCH_COVERED"])      for row in rows)
          line_missed         = sum(int(row["LINE_MISSED"])          for row in rows)
          line_covered        = sum(int(row["LINE_COVERED"])         for row in rows)

          def ratio(covered: int, missed: int) -> float:
              total = covered + missed
              return 100.0 if total == 0 else covered * 100.0 / total

          summary = [
              "## Unit Test Coverage",
              "",
              "| Metric | Covered | Missed | Coverage |",
              "| --- | ---: | ---: | ---: |",
              f"| Instructions | {instruction_covered} | {instruction_missed} | {ratio(instruction_covered, instruction_missed):.2f}% |",
              f"| Branches     | {branch_covered}      | {branch_missed}      | {ratio(branch_covered, branch_missed):.2f}% |",
              f"| Lines        | {line_covered}        | {line_missed}        | {ratio(line_covered, line_missed):.2f}% |",
          ]

          import os
          output_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          output_path.write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-report
          path: bootstrap-paper/target/site/jacoco
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bootstrap-paper/target/site/jacoco/jacoco.xml
          flags: unittests
          fail_ci_if_error: true

  language-files-validation:
    name: Language files completeness (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '21'
            paper-version: '1.21.11-R0.1-SNAPSHOT'
            worldguard-version: '7.0.13'
            worldedit-version: '7.3.12'
            mockbukkit-artifact-id: 'mockbukkit-v1.21'
            mockbukkit-version: '4.110.0'
          - java-version: '25'
            paper-version: '26.2.build.60-beta'
            worldguard-version: '7.0.16'
            worldedit-version: '7.4.3'
            mockbukkit-artifact-id: 'mockbukkit-v26.2'
            mockbukkit-version: 'local'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and install MockBukkit upgrade/v26.2
        if: matrix.mockbukkit-version == 'local'
        run: |
          git clone --depth=1 --branch upgrade/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Check language file completeness
        run: mvn -B -ntp test -pl bootstrap-paper -am -Dtest='LanguageFilesCompletenessTest' -Dsurefire.failIfNoSpecifiedTests=false -Dpaper.version=${{ matrix.paper-version }} -Dworldguard.version=${{ matrix.worldguard-version }} -Dworldedit.version=${{ matrix.worldedit-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifact-id }} -Dmockbukkit.version=${{ matrix.mockbukkit-version }}

  feature-tests:
    name: Feature tests (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '21'
            paper-version: '1.21.11-R0.1-SNAPSHOT'
            worldguard-version: '7.0.13'
            worldedit-version: '7.3.12'
            mockbukkit-artifact-id: 'mockbukkit-v1.21'
            mockbukkit-version: '4.110.0'
          - java-version: '25'
            paper-version: '26.2.build.60-beta'
            worldguard-version: '7.0.16'
            worldedit-version: '7.4.3'
            mockbukkit-artifact-id: 'mockbukkit-v26.2'
            mockbukkit-version: 'local'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and install MockBukkit upgrade/v26.2
        if: matrix.mockbukkit-version == 'local'
        run: |
          git clone --depth=1 --branch upgrade/v26.2 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run feature tests
        run: mvn -B -ntp test -pl bootstrap-paper -am -Dtest='*FeatureTest' -Dsurefire.failIfNoSpecifiedTests=false -Dpaper.version=${{ matrix.paper-version }} -Dworldguard.version=${{ matrix.worldguard-version }} -Dworldedit.version=${{ matrix.worldedit-version }} -Dmockbukkit.artifactId=${{ matrix.mockbukkit-artifact-id }} -Dmockbukkit.version=${{ matrix.mockbukkit-version }}
