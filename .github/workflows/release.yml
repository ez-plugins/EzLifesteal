name: Stable Release

# Fires when a vX.Y.Z tag is pushed, or can be triggered manually with a tag.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true

jobs:
  release:
    name: Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating the GitHub Release

    steps:
      # ──────────────────────────────────────────────────────────────────────
      #  1. CHECKOUT
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # For push:tags: github.ref is the tag ref (e.g. refs/tags/v1.1.0).
          # For workflow_dispatch: github.ref is the branch (e.g. refs/heads/main).
          # We never use the tag input here because the tag may not exist yet —
          # it is created in a later step.
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ──────────────────────────────────────────────────────────────────────
      #  2. RESOLVE VERSION
      # ──────────────────────────────────────────────────────────────────────
      - name: Resolve version from tag
        id: meta
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "ref=${REF}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      # ──────────────────────────────────────────────────────────────────────
      #  3. CREATE TAG (if it doesn't exist yet)
      #
      #  When triggered via workflow_dispatch the tag may not exist yet.
      #  This step creates and pushes it so the GitHub Release can reference it.
      # ──────────────────────────────────────────────────────────────────────
      - name: Create and push tag if missing
        run: |
          REF="${{ steps.meta.outputs.ref }}"
          if git rev-parse --verify --quiet "refs/tags/${REF}" > /dev/null; then
            echo "Tag ${REF} already exists; skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${REF}"
            git push origin "${REF}"
            echo "Created and pushed tag ${REF}."
          fi

      # ──────────────────────────────────────────────────────────────────────
      #  4. BUILD & VERSION
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit minecraft/v26
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          sed -i 's/^mockbukkit\.version=$/mockbukkit.version=local/' /tmp/MockBukkit/gradle.properties
          cd /tmp/MockBukkit && GITHUB_REPOSITORY=MockBukkit/MockBukkit ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Set release version in pom.xml
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.meta.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B -ntp -DskipTests package

      # ──────────────────────────────────────────────────────────────────────
      #  5. EXTRACT CHANGELOG
      #
      #  Reads the section for this version from CHANGELOG.md.
      #  Falls back to a generic message when the section is missing.
      # ──────────────────────────────────────────────────────────────────────
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          HEADER="## [${VERSION}]"

          # Fixed-string match via index() avoids regex issues with dots in versions.
          NOTES=$(awk \
            -v hdr="$HEADER" \
            '/^## \[/ && p { exit }
             index($0, hdr) == 1 { p=1; next }
             p { print }' \
            CHANGELOG.md)

          if [[ -z "$NOTES" ]]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi

          printf '%s\n' "$NOTES" > release-notes.md
          echo "=== Release notes preview ===" && cat release-notes.md

      # ──────────────────────────────────────────────────────────────────────
      #  6. GITHUB RELEASE
      # ──────────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.ref }}" \
            --title "EzLifesteal ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md \
            "target/ezlifesteal-v${{ steps.meta.outputs.version }}.jar"

      # ──────────────────────────────────────────────────────────────────────
      #  7. MODRINTH RELEASE
      # ──────────────────────────────────────────────────────────────────────
      - name: Release to Modrinth (stable)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          JAR="target/ezlifesteal-v${VERSION}.jar"

          # Fetch Minecraft 1.21+ release game versions from the Modrinth tag API.
          # startswith("1.") is used so that 2026+ versions (26.x) are never matched.
          # A User-Agent is required by Modrinth policy (https://docs.modrinth.com/api/#user-agents).
          GAME_VERSIONS=$(curl -sf \
            -H "User-Agent: EzLifesteal-release-workflow/1.0 (github.com/${{ github.repository }})" \
            "https://api.modrinth.com/v2/tag/game_version" | \
            jq -c '[.[] |
              select(.version_type == "release") |
              select(.version | startswith("1.")) |
              select(.version | split(".") | .[1] | tonumber >= 21) |
              .version
            ]')

          CHANGELOG=$(cat release-notes.md)

          DATA=$(jq -n \
            --arg     name            "EzLifesteal ${VERSION}" \
            --arg     version_number  "${VERSION}" \
            --arg     changelog       "$CHANGELOG" \
            --argjson game_versions   "$GAME_VERSIONS" \
            '{
              name:           $name,
              version_number: $version_number,
              changelog:      $changelog,
              dependencies: [
                {project_id: "placeholderapi", dependency_type: "optional"},
                {project_id: "worldguard",     dependency_type: "optional"},
                {project_id: "ezseasons",      dependency_type: "optional"},
                {project_id: "ezcountdown",    dependency_type: "optional"},
                {project_id: "teams-api",      dependency_type: "optional"}
              ],
              game_versions:  $game_versions,
              version_type:   "release",
              loaders:        ["paper", "purpur"],
              featured:       true,
              project_id:     "ezlifesteal",
              file_parts:     ["file"]
            }')

          curl -f --show-error -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: EzLifesteal-release-workflow/1.0 (github.com/${{ github.repository }})" \
            -F "data=${DATA};type=application/json" \
            -F "file=@${JAR};type=application/java-archive"

      # ──────────────────────────────────────────────────────────────────────
      #  8. DISCORD NOTIFICATION
      # ──────────────────────────────────────────────────────────────────────
      - name: Post Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.EZLIFESTEAL_RELEASE_DISCORD_WEBHOOK }}
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.meta.outputs.version }}"
          GH_URL="https://github.com/${REPO}/releases/tag/${{ steps.meta.outputs.ref }}"
          MODRINTH_URL="https://modrinth.com/plugin/ezlifesteal/version/${VERSION}"

          # Truncate changelog to fit Discord's 4096-char embed description limit.
          CHANGELOG=$(head -c 3800 release-notes.md || true)

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg gh_url "$GH_URL" \
            --arg modrinth_url "$MODRINTH_URL" \
            --arg changelog "$CHANGELOG" \
            '{
              embeds: [{
                title: ("🚀 EzLifesteal " + $version + " — Stable Release"),
                url: $gh_url,
                color: 3447003,
                description: $changelog,
                fields: [
                  { name: "GitHub Release", value: ("[View on GitHub](" + $gh_url + ")"),             inline: true },
                  { name: "Modrinth",       value: ("[Download on Modrinth](" + $modrinth_url + ")"), inline: true }
                ],
                footer: { text: "Stable release" }
              }]
            }')

          curl --fail -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
